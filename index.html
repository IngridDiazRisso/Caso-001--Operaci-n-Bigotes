<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caso001</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="containertitle">
        <h2 class="title">UNIDAD FELINA DE</h2>
        <h2 class="title">INVESTIGACIÓN</h2>
        <h4 class="subtitle">Caso #001: Operación Bigotes</h4>
        <div class="imgarchivos">
          <img class="imgportada" src="img/archivos.png" />
          <img class="imghuellas imgportada" src="img/huellas.png" />
        </div>
      </div>
      <div class="subheader">
        <p class="subheadertitle">PELUSA Y KIWI NECESITAN TU AYUDA ⬇</p>
      </div>
    </header>
    <div class="containerjugar">
      <header class="infoTime">
        <div class="info"></div>
        <div class="time">
          <div class="timephoto"></div>
          <h4 class="subheadertitle">30:00</h4>
        </div>
        <div class="blanck"></div>
      </header>
      <div class="chat">
        <img src="img/Pelusa.png" class="pelusa" />
        <div class="chat-left">
          Hemos detectado actividad sospechosa en la casa. Un caso misterioso
          está en marcha y solo tú puedes ayudarnos a resolverlo
        </div>
      </div>
      <div class="chat">
        <div class="chat-right">
          Disponmos de 30 minutos para completar la misión.
        </div>
        <img src="img/Kiwi.png" class="kiwi" />
      </div>
      <button class="play">JUGAR</button>
    </div>

    <script src="main.js"></script>
  </body>
</html>
